<style>
@font-face{font-family:'DM Serif Display';font-style:normal;font-weight:400;font-display:swap;src:url(/assets/fonts/dmserif.woff2) format('woff2')}
@font-face{font-family:'Libre Franklin';font-style:normal;font-weight:400 700;font-display:swap;src:url(/assets/fonts/librefranklin.woff2) format('woff2')}
:root{
  --bg:#150f0c;--bg-2:#1e150f;--bg-3:#28190f;--bone:#f5ede1;--paper:#f6f1e8;
  --ember:#ff7a2d;--gold:#ffb84d;--red:#cf2a1c;--red-ink:#a81d18;--red-deep:#7b1512;
  --ink:#1a1310;--muted:#cbb4a2;--line:#3a2b21;--white:#fff;
  --f-display:"DM Serif Display",Georgia,serif;--f-body:"Libre Franklin",system-ui,-apple-system,sans-serif;
  --radius-lg:20px;--radius-pill:999px;
  --shadow-sm:0 2px 10px rgba(0,0,0,.35);--shadow:0 12px 34px rgba(0,0,0,.5);
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:var(--f-body);color:var(--bone);font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden;
  min-height:100dvh;display:flex;flex-direction:column;align-items:center;
  background:
    radial-gradient(900px 420px at 50% -6%, rgba(255,122,45,.18) 0%, transparent 60%),
    radial-gradient(760px 380px at 50% 108%, rgba(207,42,28,.16) 0%, transparent 60%),
    var(--bg);
}
img{max-width:100%;display:block}
a{color:var(--gold);text-decoration:none}
h1{font-family:var(--f-display);line-height:1.06;margin:0;color:var(--bone);letter-spacing:.01em}
:focus-visible{outline:3px solid var(--ember);outline-offset:3px;border-radius:12px}

.wrap{width:100%;max-width:460px;padding:40px 20px 32px;text-align:center}
.logo{max-width:190px;height:auto;margin:0 auto 18px;filter:drop-shadow(var(--shadow))}
h1{font-size:clamp(1.7rem,6.5vw,2.15rem)}
.loc{display:inline-flex;align-items:center;gap:9px;margin:10px 0 0;font-family:var(--f-body);font-weight:700;
  font-size:.78rem;letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
.loc::before,.loc::after{content:"";width:18px;height:2px;border-radius:2px;background:var(--ember)}
.beads{height:14px;width:150px;margin:18px auto 26px;
  background-image:radial-gradient(circle,var(--ember) 42%,transparent 46%),radial-gradient(circle,var(--gold) 42%,transparent 46%);
  background-size:24px 14px,24px 14px;background-position:0 center,12px center;background-repeat:repeat-x;opacity:.95}

.socials{display:flex;justify-content:center;gap:14px;margin:0 0 26px}
.social{display:inline-flex;align-items:center;justify-content:center;width:50px;height:50px;border-radius:var(--radius-pill);
  background:var(--bg-3);color:var(--bone);box-shadow:var(--shadow-sm);border:1px solid var(--line);
  transition:transform .15s ease,background .15s ease,color .15s ease,border-color .15s ease}
.social:hover{transform:translateY(-3px);background:var(--ember);color:var(--ink);border-color:var(--ember)}
.social svg{width:23px;height:23px}

.links{display:flex;flex-direction:column;gap:13px}
.link{display:flex;align-items:center;gap:14px;width:100%;padding:16px 18px;border-radius:var(--radius-lg);
  font-family:var(--f-display);font-weight:400;font-size:1.12rem;box-shadow:var(--shadow-sm);
  transition:transform .15s ease,box-shadow .15s ease,filter .15s ease}
.link:hover{transform:translateY(-2px);box-shadow:var(--shadow);filter:brightness(1.04)}
.link .ic{flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:var(--radius-pill)}
.link .ic svg{width:20px;height:20px}
.link .lbl{flex:1 1 auto;text-align:left}
.link .arw{flex:0 0 auto;opacity:.6}
.link .arw svg{width:18px;height:18px}
.link--gold{background:var(--gold);color:var(--ink)}
.link--gold .ic{background:rgba(26,19,16,.16)}
.link--red{background:var(--red);color:var(--bone)}
.link--red .ic{background:rgba(255,255,255,.18)}
.link--dark{background:var(--bg-3);color:var(--bone);border:1px solid var(--line)}
.link--dark .ic{background:rgba(255,122,45,.18);color:var(--ember)}

.foot{margin:30px 0 4px;font-size:.82rem;color:var(--muted)}
.foot a{color:var(--gold);font-weight:600}
</style>
</head>
